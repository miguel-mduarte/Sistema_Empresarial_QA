worker_processes 1;
pid /home/felipe/apps/folha-clara/nginx.pid;
error_log /home/felipe/apps/folha-clara/logs/error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/felipe/apps/folha-clara/logs/access.log;
    client_body_temp_path /home/felipe/apps/folha-clara/tmp/client;
    proxy_temp_path /home/felipe/apps/folha-clara/tmp/proxy;
    server_tokens off;
    server {
        listen 8083;
        server_name 164.163.10.12;
        root /home/felipe/apps/folha-clara/current/frontend/dist;
        index index.html;
        location /api/ {
            proxy_pass http://127.0.0.1:3183;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
